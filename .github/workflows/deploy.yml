name: Deploy to Cloudflare Pages

# Every production deployment comes from this workflow, which is the only
# thing holding the Cloudflare credentials. Pushing to main deploys to
# production; a pull request gets its own preview URL.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  build:
    name: Build, test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check --minimumFailingSeverity error

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Catches broken internal links, missing canonicals, duplicate titles and
      # descriptions, and any tool page that failed to render its interface.
      - name: Verify build output
        run: npm run verify

      # Drives a real browser over every page: catches JS errors, outbound
      # requests (which would break the privacy guarantee), accessibility
      # regressions, mobile overflow, and any tool that stops producing output.
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser audit
        run: npm run audit

      # WebKit is Safari's engine, where client-side tools break most often:
      # clipboard permissions, <dialog>, Intl.Segmenter and regex lookbehind
      # all landed there later than in Chromium.
      - name: Cross-browser tool suite
        run: npm run cross-browser

      # Feeds XSS payloads to every tool, checks the CSP is non-trivial, and
      # confirms a catastrophically backtracking regex cannot hang the page.
      - name: Security check
        run: npm run security

      # Drives every tool through empty, malformed and 2.1 MB input, and
      # checks the site is operable from the keyboard alone.
      - name: Edge cases and keyboard
        run: npm run edge

      # Fails the build if Core Web Vitals or the transfer budget regress.
      - name: Core Web Vitals budget
        run: npm run perf

      # Secrets cannot be referenced in a job-level `if`, so the token is
      # surfaced as an env var and the step skips itself when it is absent.
      # This keeps CI green before Cloudflare is wired up, and on pull
      # requests from forks, which never receive secrets.
      - name: Check for deploy credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "present=${{ env.CF_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=bytecabin
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Report skipped deploy
        if: steps.creds.outputs.present != 'true'
        run: |
          echo "::notice::Build and tests passed. Deploy skipped — set the" \
               "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable it."

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.creds.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            if (!url) return;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed: ${url}`,
            });
