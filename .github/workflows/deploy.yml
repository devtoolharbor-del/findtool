name: Deploy to Cloudflare Pages

# Every production deployment comes from this workflow, which is the only
# thing holding the Cloudflare credentials. Pushing to main deploys to
# production; a pull request gets its own preview URL.
#
# Structure: build once, fan the verification suites out in parallel, then
# deploy the artifact that was actually verified. Run sequentially these
# suites took 10.2 minutes against a 10 minute limit and the job was
# cancelled with seconds of work left. In parallel the wall clock is roughly
# the slowest single suite, and a failure names itself in the job list rather
# than having to be dug out of one long log.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  # ── Build once, and share the exact bytes every later job checks ───────
  build:
    name: Build and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx astro check --minimumFailingSeverity error

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Links, canonicals, duplicate metadata, structured data, social cards,
      # secrets in output, and that every registry entry actually rendered.
      - name: Verify build output
        run: npm run verify

      # Later jobs verify and deploy these exact bytes rather than rebuilding,
      # so what ships is what was tested.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          include-hidden-files: true

  # ── Verification suites, in parallel ──────────────────────────────────
  verify:
    name: ${{ matrix.suite.label }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # one failing suite must not hide the others
      matrix:
        suite:
          - { script: audit, label: Browser audit, browsers: chromium }
          - { script: cross-browser, label: Chromium Firefox WebKit, browsers: chromium firefox webkit }
          - { script: edge, label: Edge cases and keyboard, browsers: chromium }
          - { script: security, label: Security, browsers: chromium }
          - { script: perf, label: Core Web Vitals budget, browsers: chromium }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Only the cross-browser suite needs all three engines; installing all
      # of them five times over would cost more than the parallelism saves.
      - name: Install browsers
        run: npx playwright install --with-deps ${{ matrix.suite.browsers }}

      - run: npm run ${{ matrix.suite.script }}

  # ── Deploy the artifact that passed ───────────────────────────────────
  deploy:
    name: Deploy
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Secrets cannot be referenced in a job-level `if`, so the token is
      # surfaced as an env var and the step skips itself when it is absent.
      # This keeps CI green on pull requests from forks, which never receive
      # secrets.
      - name: Check for deploy credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "present=${{ env.CF_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=findtool
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Report skipped deploy
        if: steps.creds.outputs.present != 'true'
        run: |
          echo "::notice::Build and tests passed. Deploy skipped — set the" \
               "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable it."

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.creds.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            if (!url) return;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed: ${url}`,
            });
